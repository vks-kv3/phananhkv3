name: Kiểm thử build
on:
  push:
    branches: [tra-cuu-ma-so]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Kiểm tra kiểu TypeScript
        run: npx tsc --noEmit 2>&1 | tee tsc.log || true
      - name: Ghi lỗi TypeScript
        run: grep -E "error TS" tsc.log | head -20 | sed 's/^/::warning::/' || true
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: dummy-key-for-ci
      - name: Kiểm thử đầu-cuối
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort &) ; sleep 5
          node .github/e2e/test.mjs
